android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Kotlin JVM target validation
kotlin.jvm.target.validation.mode=warning

# Disable daemon to avoid Java version caching issues
org.gradle.daemon=false

# Force Java version for Gradle
org.gradle.java.home=C:\\Users\\Lenovo\\.jdks\\jdk-17.0.13+11

# JVM args: mask Java 25 as Java 17 for Kotlin compiler
org.gradle.jvmargs=-Xmx2048m \
  -XX:+HeapDumpOnOutOfMemoryError \
  --add-opens=java.base/java.lang=ALL-UNNAMED \
  --add-opens=java.base/java.util=ALL-UNNAMED \
  -Djava.specification.version=17 \
  -Djava.version=17.0.10 \
  -Djava.runtime.version=17.0.10+7 \
  -Djava.vm.specification.version=17 \
  -Djava.specification.name="Java Platform API Specification" \
  -Djava.vm.specification.name="Java Virtual Machine Specification"
