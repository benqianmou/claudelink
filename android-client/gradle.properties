android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Kotlin JVM target validation
kotlin.jvm.target.validation.mode=warning

# Disable daemon to avoid Java version caching issues
org.gradle.daemon=false

# Force Java version for Gradle - COMMENTED OUT to avoid conflict with version masking
# org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# JVM args to suppress Java version warnings and fake Java version for Kotlin
org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError --add-opens=java.base/java.lang=ALL-UNNAMED -Djava.specification.version=17 -Djava.version=17.0.2 -Djava.runtime.version=17.0.2+8
