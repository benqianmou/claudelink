<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ClaudeLink Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #21262d;
      --border: #30363d;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 状态栏 ── */
    #status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      z-index: 20;
    }
    .brand {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 0.3px;
      user-select: none;
      margin-right: 2px;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 11px;
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6e7681;
      transition: background 0.3s;
    }
    .status-indicator.connected { background: var(--green); box-shadow: 0 0 8px rgba(63, 185, 80, 0.6); }
    .status-indicator.busy { background: var(--yellow); box-shadow: 0 0 8px rgba(210, 153, 34, 0.6); animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: 0.45; } }
    .spacer { flex: 1; }

    .btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: transform 0.12s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .btn:hover:not(:disabled) { background: #2d333b; border-color: var(--text-dim); transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0) scale(0.97); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-icon { padding: 5px 9px; }
    .btn-primary {
      background: linear-gradient(180deg, #1f6feb, #1a5fd0);
      border-color: rgba(88, 166, 255, 0.4);
      color: #fff;
      font-weight: 600;
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(180deg, #388bfd, #1f6feb);
      border-color: var(--accent);
      box-shadow: 0 4px 14px rgba(31, 111, 235, 0.35);
    }
    .btn-primary.connected {
      background: linear-gradient(180deg, #238636, #1f7a31);
      border-color: rgba(63, 185, 80, 0.4);
    }
    .btn-primary.connected:hover:not(:disabled) {
      background: linear-gradient(180deg, #2ea043, #238636);
      box-shadow: 0 4px 14px rgba(46, 160, 67, 0.35);
    }

    /* ── 主布局 ── */
    #main {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative;
    }

    /* ── 任务看板 ── */
    #task-board {
      width: 280px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #task-board.collapsed { margin-left: -280px; }
    .board-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
    }
    .task-count {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      border-radius: 999px;
      padding: 1px 8px;
    }
    .board-scroll { flex: 1; overflow-y: auto; padding: 12px; }
    .board-scroll::-webkit-scrollbar { width: 8px; }
    .board-scroll::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }
    .task-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      margin: 2px 2px 8px;
    }
    .task-section + .task-section { margin-top: 18px; }

    /* Claude 状态卡片 */
    #claude-status {
      background: var(--bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      animation: slideIn 0.25s ease;
    }
    #claude-status.inactive {
      border-left-color: var(--border);
      opacity: 0.6;
    }
    .claude-status-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .claude-status-icon {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    #claude-status.inactive .claude-status-icon {
      background: var(--text-dim);
      box-shadow: none;
    }
    .claude-status-body {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.5;
    }
    .claude-status-row {
      display: flex;
      justify-content: space-between;
      margin-top: 3px;
    }
    .claude-status-label { opacity: 0.7; }
    .claude-status-value {
      font-family: "JetBrains Mono", Consolas, monospace;
      color: var(--text);
    }

    .task-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 8px;
      animation: slideIn 0.25s ease;
      transition: border-color 0.2s;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } }
    .task-card.running { border-left-color: var(--yellow); }
    .task-card.done { border-left-color: var(--green); opacity: 0.7; }
    .task-name {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 12.5px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      word-break: break-all;
    }
    .task-icon { flex-shrink: 0; }
    .task-card.running .task-icon { color: var(--yellow); animation: spin 1.4s linear infinite; }
    .task-card.done .task-icon { color: var(--green); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .task-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .task-empty {
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
      padding: 14px 0;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    /* ── 终端 ── */
    #terminal-wrapper {
      flex: 1;
      min-width: 0;
      background: #000;
      padding: 8px;
      display: flex;
    }
    #terminal-container { flex: 1; min-width: 0; }
    .xterm { height: 100%; }
    .xterm-viewport::-webkit-scrollbar { width: 10px; }
    .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
    .xterm-viewport::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 5px; }
    .xterm-viewport::-webkit-scrollbar-thumb:hover { background: var(--border); }

    /* ── 移动端遮罩 ── */
    #backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 30;
      opacity: 0;
      transition: opacity 0.25s;
    }

    /* ── 错误提示 ── */
    .error-toast {
      position: fixed;
      top: 64px;
      right: 16px;
      background: var(--red);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 100;
    }
    .error-toast.show { display: block; animation: toastIn 0.25s ease; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } }

    /* ── 移动端 ── */
    @media (max-width: 900px) {
      #task-board {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 40;
        transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 8px 0 32px rgba(0, 0, 0, 0.5);
      }
      #task-board.collapsed { margin-left: 0; }
      #task-board.open { transform: translateX(0); }
      #backdrop.show { display: block; opacity: 1; }
      .btn { min-height: 38px; }
      #status-bar { gap: 8px; padding: 8px 10px; }
    }

    /* 会话详情面板 */
    .panel-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 7, 12, 0.7);
      opacity: 0;
      visibility: hidden;
      transition: opacity 300ms, visibility 300ms;
      z-index: 999;
    }
    .panel-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .session-detail-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: min(600px, 90vw);
      height: 100%;
      background: var(--bg);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }
    .session-detail-panel.open {
      transform: translateX(0);
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-hover);
    }
    .panel-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .close-btn:hover {
      background: var(--border);
      color: var(--text);
    }
    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .session-info-card {
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .session-info-card .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .session-info-card .project-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .session-info-card .meta-row {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .tasks-section {
      margin-bottom: 20px;
    }
    .tasks-section h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
      margin: 0 0 12px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .detail-tabs {
      display: flex;
      gap: 4px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      bottom: 0;
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      padding: 12px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all 150ms;
    }
    .tab-btn:hover {
      color: var(--text);
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tab-content {
      padding: 16px;
      min-height: 300px;
    }
    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }
    #detail-terminal {
      height: 400px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .history-list, .summary-content {
      font-size: 14px;
      line-height: 1.6;
    }
    .history-item {
      padding: 12px;
      background: var(--bg-hover);
      border-radius: 8px;
      margin-bottom: 8px;
      border-left: 3px solid var(--accent);
    }
    .history-item .timestamp {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .history-item .command {
      font-family: 'SF Mono', Consolas, monospace;
      color: var(--text);
    }
    .summary-section {
      margin-bottom: 20px;
    }
    .summary-section h4 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin: 0 0 8px 0;
    }
    .summary-section ul {
      margin: 0;
      padding-left: 20px;
      color: var(--text-dim);
    }
    .summary-section li {
      margin-bottom: 4px;
    }

    /* ── 会话详情面板 ── */
    .panel-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 100;
    }
    .panel-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .session-detail-panel {
      position: fixed;
      top: 0;
      right: -480px;
      width: 480px;
      max-width: 90vw;
      height: 100vh;
      background: var(--surface);
      box-shadow: -4px 0 24px rgba(0, 0, 0, 0.5);
      transition: right 0.3s ease;
      z-index: 101;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .session-detail-panel.open {
      right: 0;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .panel-header h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 28px;
      color: var(--text-dim);
      cursor: pointer;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .close-btn:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .session-info-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .session-info-card .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .session-info-card .project-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .session-info-card .meta-row {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .tasks-section {
      margin-bottom: 20px;
    }
    .tasks-section h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .task-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .task-card.done {
      opacity: 0.7;
    }
    .task-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      flex-shrink: 0;
      margin-top: 2px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .task-text {
      flex: 1;
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 13px;
      color: var(--text);
      word-break: break-all;
    }
    .task-meta {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .detail-tabs {
      display: flex;
      gap: 0;
      padding: 0 20px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }
    .tab-btn:hover {
      color: var(--text);
    }
    .tab-btn.active {
      color: var(--accent);
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
    }

    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }

    @media (max-width: 900px) {
      .session-detail-panel {
        width: 100vw;
        max-width: 100vw;
        right: -100vw;
      }
    }
  </style>
</head>
<body>
  <div id="status-bar">
    <button id="board-toggle" class="btn btn-icon" title="任务看板">📋</button>
    <span class="brand">▸ ClaudeLink</span>
    <div class="pill">
      <div class="status-indicator" id="status-indicator"></div>
      <span id="status-text">已断开</span>
    </div>
    <span class="pill" id="client-count">0 客户端</span>
    <div class="spacer"></div>
    <button id="clear-btn" class="btn" disabled>清屏</button>
    <button id="restart-btn" class="btn" disabled>重启</button>
    <button id="connect-btn" class="btn btn-primary">连接</button>
  </div>

  <div id="main">
    <aside id="task-board">
      <div class="board-header">
        <span>任务看板</span>
        <span class="task-count" id="task-count">0</span>
      </div>
      <div class="board-scroll">
        <div class="task-section">
          <div class="task-section-title">Claude Code</div>
          <div id="claude-status" class="inactive">
            <div class="claude-status-header">
              <div class="claude-status-icon"></div>
              <span>未检测到活动会话</span>
            </div>
          </div>
        </div>
        <div class="task-section">
          <div class="task-section-title">进行中</div>
          <div id="active-tasks"><div class="task-empty">暂无任务</div></div>
        </div>
        <div class="task-section">
          <div class="task-section-title">历史</div>
          <div id="task-history"><div class="task-empty">暂无记录</div></div>
        </div>
      </div>
    </aside>
    <div id="terminal-wrapper">
      <div id="terminal-container"></div>
    </div>
  </div>

  <div id="backdrop"></div>
  <div class="error-toast" id="error-toast"></div>

  <!-- 会话详情面板 -->
  <div class="panel-overlay" id="panel-overlay"></div>
  <div class="session-detail-panel" id="session-detail-panel">
    <div class="panel-header">
      <h2>Claude Code 会话详情</h2>
      <button class="close-btn" id="close-panel-btn">&times;</button>
    </div>
    <div class="panel-content">
      <div class="session-info-card" id="session-info">
        <div class="status-row">
          <div class="claude-status-icon"></div>
          <span class="project-name">加载中...</span>
        </div>
        <div class="meta-row">PID: - | 工作目录: -</div>
      </div>

      <div class="tasks-section" id="panel-tasks-section">
        <h3>进行中</h3>
        <div id="panel-active-tasks"></div>
      </div>

      <div class="tasks-section" id="panel-history-section">
        <h3>历史</h3>
        <div id="panel-task-history"></div>
      </div>
    </div>

    <div class="detail-tabs">
      <button class="tab-btn active" data-tab="overview">概览</button>
      <button class="tab-btn" data-tab="history">输入历史</button>
      <button class="tab-btn" data-tab="terminal">终端输出</button>
    </div>
    <div class="tab-content">
      <div class="tab-pane active" id="tab-overview">
        <div class="summary-content" id="session-summary">
          <p style="color: var(--text-dim);">等待会话数据...</p>
        </div>
      </div>
      <div class="tab-pane" id="tab-history">
        <div class="history-list" id="input-history"></div>
      </div>
      <div class="tab-pane" id="tab-terminal">
        <div id="detail-terminal"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { Terminal } from 'https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/+esm';
    import { FitAddon } from 'https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/+esm';

    const $ = (id) => document.getElementById(id);
    const connectBtn = $('connect-btn'), clearBtn = $('clear-btn'), restartBtn = $('restart-btn');
    const statusText = $('status-text'), statusIndicator = $('status-indicator'), clientCount = $('client-count');
    const errorToast = $('error-toast'), board = $('task-board'), backdrop = $('backdrop');
    const taskCount = $('task-count'), activeList = $('active-tasks'), historyList = $('task-history');

    let ws = null, term = null, fitAddon = null;
    let inputBuffer = '', inputTimer = null;

    /* ── 任务看板（纯客户端：输入即任务，输出静默即完成） ── */
    const taskBoard = {
      tasks: [],
      nextId: 1,
      idleTimer: null,
      IDLE_MS: 2500,      // ponytail: 输出静默判定完成的阈值，误报只影响看板状态
      MAX_DONE: 20,

      add(text) {
        this.tasks.unshift({ id: this.nextId++, text, status: 'running', start: Date.now() });
        this.render();
        this.bumpActivity();
        updateIndicator();
      },
      bumpActivity() {
        if (!this.tasks.some(t => t.status === 'running')) return;
        clearTimeout(this.idleTimer);
        this.idleTimer = setTimeout(() => this.finish(), this.IDLE_MS);
      },
      finish() {
        const now = Date.now();
        let changed = false;
        for (const t of this.tasks) {
          if (t.status === 'running') { t.status = 'done'; t.end = now; changed = true; }
        }
        const done = this.tasks.filter(t => t.status === 'done');
        if (done.length > this.MAX_DONE) {
          const drop = new Set(done.slice(this.MAX_DONE).map(t => t.id));
          this.tasks = this.tasks.filter(t => !drop.has(t.id));
        }
        if (changed) { this.render(); updateIndicator(); }
      },
      render() {
        const running = this.tasks.filter(t => t.status === 'running');
        const done = this.tasks.filter(t => t.status === 'done');
        taskCount.textContent = running.length > 0 ? running.length : this.tasks.length;
        this.renderList(activeList, running, '暂无任务');
        this.renderList(historyList, done, '暂无记录');
      },
      renderList(el, list, emptyText) {
        el.textContent = '';
        if (!list.length) {
          const d = document.createElement('div');
          d.className = 'task-empty';
          d.textContent = emptyText;
          el.appendChild(d);
          return;
        }
        for (const t of list) el.appendChild(this.card(t));
      },
      card(t) {
        const card = document.createElement('div');
        card.className = `task-card ${t.status}`;
        const name = document.createElement('div');
        name.className = 'task-name';
        const icon = document.createElement('span');
        icon.className = 'task-icon';
        icon.textContent = t.status === 'running' ? '◌' : '✓';
        const label = document.createElement('span');
        label.textContent = t.text;  // textContent 防 XSS
        name.append(icon, label);
        const meta = document.createElement('div');
        meta.className = 'task-meta';
        const dur = document.createElement('span');
        const secs = Math.max(0, Math.round(((t.end || Date.now()) - t.start) / 1000));
        dur.textContent = t.status === 'running' ? `${secs}s…` : `${secs}s`;
        const time = document.createElement('span');
        time.textContent = new Date(t.start).toLocaleTimeString();
        meta.append(dur, time);
        card.append(name, meta);
        return card;
      }
    };

    // 进行中的任务每秒刷新一次耗时
    setInterval(() => {
      if (taskBoard.tasks.some(t => t.status === 'running')) taskBoard.render();
    }, 1000);

    function updateIndicator() {
      const connected = ws?.readyState === WebSocket.OPEN;
      const busy = connected && taskBoard.tasks.some(t => t.status === 'running');
      statusIndicator.classList.toggle('connected', connected && !busy);
      statusIndicator.classList.toggle('busy', busy);
    }

    /* ── 终端初始化 ── */
    function initTerminal() {
      term = new Terminal({
        cursorBlink: true,
        cursorStyle: 'block',
        fontFamily: '"JetBrains Mono", "Consolas", "Courier New", monospace',
        fontSize: window.innerWidth < 768 ? 12 : 14,
        theme: {
          background: '#000000',
          foreground: '#f0f6fc',
          cursor: '#58a6ff',
          selectionBackground: 'rgba(88, 166, 255, 0.3)',
          black: '#484f58',
          red: '#ff7b72',
          green: '#3fb950',
          yellow: '#d29922',
          blue: '#58a6ff',
          magenta: '#bc8cff',
          cyan: '#39c5cf',
          white: '#b1bac4',
          brightBlack: '#6e7681',
          brightRed: '#ffa198',
          brightGreen: '#56d364',
          brightYellow: '#e3b341',
          brightBlue: '#79c0ff',
          brightMagenta: '#d2a8ff',
          brightCyan: '#56d4dd',
          brightWhite: '#f0f6fc'
        },
        allowProposedApi: true,
        scrollback: 10000,
        convertEol: true
      });

      fitAddon = new FitAddon();
      term.loadAddon(fitAddon);
      term.open($('terminal-container'));
      setTimeout(fitAndSync, 100);

      // 输入缓冲：普通字符 16ms 批量发送，Enter/控制键立即发送
      let draft = '';   // 当前命令草稿（用于任务看板）
      let inEsc = false;
      term.onData((data) => {
        if (ws?.readyState !== WebSocket.OPEN) return;
        inputBuffer += data;

        // ponytail: 方向键/历史召回的命令不追踪（需解析输出，代价不值）
        for (const ch of data) {
          if (inEsc) { if (/[a-zA-Z~]/.test(ch)) inEsc = false; continue; }
          if (ch === '\x1B') { inEsc = true; draft = ''; continue; }
          if (ch === '\r') {
            const cmd = draft.trim();
            if (cmd) taskBoard.add(cmd.slice(0, 80));
            draft = '';
          } else if (ch === '\x7F' || ch === '\b') {
            draft = draft.slice(0, -1);
          } else if (ch === '\x03') {
            draft = '';
            taskBoard.finish();  // Ctrl+C 视为中断当前任务
          } else if (ch >= ' ') {
            draft += ch;
          }
        }

        if (inputTimer) clearTimeout(inputTimer);
        if (data.includes('\r') || data.charCodeAt(0) < 32) {
          sendInputBuffer();
        } else {
          inputTimer = setTimeout(sendInputBuffer, 16);
        }
      });

      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(fitAndSync, 100);
      });
    }

    function fitAndSync() {
      if (!fitAddon) return;
      const targetSize = window.innerWidth < 768 ? 12 : 14;
      if (term.options.fontSize !== targetSize) term.options.fontSize = targetSize;
      fitAddon.fit();
      if (ws?.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      }
    }

    function sendInputBuffer() {
      if (inputBuffer && ws?.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'input', data: inputBuffer }));
        inputBuffer = '';
      }
      inputTimer = null;
    }

    /* ── WebSocket ── */
    connectBtn.onclick = () => {
      if (ws?.readyState === WebSocket.OPEN) {
        ws.close();
        return;
      }

      if (!term) initTerminal();

      const wsUrl = `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusText.textContent = '已连接';
        connectBtn.textContent = '断开';
        connectBtn.classList.add('connected');
        clearBtn.disabled = false;
        restartBtn.disabled = false;
        updateIndicator();
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);

          if (msg.type === 'output') {
            term.write(msg.data);
            taskBoard.bumpActivity();
          } else if (msg.type === 'history') {
            term.clear();
            term.write(msg.data);
            if (msg.clientCount) clientCount.textContent = `${msg.clientCount} 客户端`;
          } else if (msg.type === 'client_count') {
            clientCount.textContent = `${msg.count} 客户端`;
          } else if (msg.type === 'error') {
            showError(msg.message);
          } else if (msg.type === 'restart') {
            if (msg.clearScreen) term.clear();
            taskBoard.finish();
            term.write('\r\n[PTY 已重启]\r\n');
          } else if (msg.type === 'pty_exited') {
            taskBoard.finish();
            term.write(`\r\n[PTY 已退出，退出码 ${msg.exitCode}]\r\n`);
          } else if (msg.type === 'claude_status') {
            updateClaudeStatus(msg);
          }
        } catch (err) {
          term.write(e.data);
        }
      };

      ws.onclose = () => {
        statusText.textContent = '已断开';
        connectBtn.textContent = '连接';
        connectBtn.classList.remove('connected');
        clearBtn.disabled = true;
        restartBtn.disabled = true;
        taskBoard.finish();
        updateIndicator();
      };

      ws.onerror = () => {
        statusText.textContent = '连接失败';
        showError('WebSocket 连接失败');
      };
    };

    function showError(msg) {
      errorToast.textContent = msg;
      errorToast.classList.add('show');
      setTimeout(() => errorToast.classList.remove('show'), 3000);
    }

    function updateClaudeStatus(msg) {
      const container = $('claude-status');
      if (!msg.active) {
        container.className = 'inactive';
        container.innerHTML = `
          <div class="claude-status-header">
            <div class="claude-status-icon"></div>
            <span>未检测到活动会话</span>
          </div>`;
        container.style.cursor = 'default';
        container.onclick = null;
        return;
      }

      container.className = '';
      const s = msg;
      const statusText = s.status === 'busy' ? '运行中' : '空闲';
      const projectName = s.projectName || '未命名项目';
      container.innerHTML = `
        <div class="claude-status-header">
          <div class="claude-status-icon"></div>
          <span>${projectName}</span>
        </div>
        <div class="claude-status-body">
          <div class="claude-status-row">
            <span class="claude-status-label">状态</span>
            <span class="claude-status-value">${statusText}</span>
          </div>
          <div class="claude-status-row">
            <span class="claude-status-label">PID</span>
            <span class="claude-status-value">${s.pid}</span>
          </div>
          <div class="claude-status-row">
            <span class="claude-status-label">工作目录</span>
            <span class="claude-status-value" style="font-size: 10px; word-break: break-all;">${s.cwd}</span>
          </div>
        </div>`;

      container.style.cursor = 'pointer';
      container.onclick = () => openSessionPanel(msg);

      window.lastClaudeStatus = msg;
    }

    /* ── 看板折叠 / 移动端抽屉 ── */
    $('board-toggle').onclick = () => {
      if (window.innerWidth <= 900) {
        const open = board.classList.toggle('open');
        backdrop.classList.toggle('show', open);
      } else {
        board.classList.toggle('collapsed');
        setTimeout(fitAndSync, 320);
      }
    };
    backdrop.onclick = () => {
      board.classList.remove('open');
      backdrop.classList.remove('show');
    };

    clearBtn.onclick = () => term?.clear();

    restartBtn.onclick = () => {
      if (confirm('重启 PTY？当前会话将丢失。')) {
        ws?.send(JSON.stringify({ type: 'restart' }));
      }
    };

    /* ── 会话详情面板 ── */
    const panelOverlay = $('panel-overlay');
    const sessionPanel = $('session-detail-panel');
    const closePanelBtn = $('close-panel-btn');
    let detailTerminal = null;

    function openSessionPanel(msg) {
      if (!msg || !msg.active) return;

      updatePanelInfo(msg);
      updatePanelTasks();
      updatePanelTabs(msg);

      panelOverlay.classList.add('show');
      sessionPanel.classList.add('open');

      if (!detailTerminal) {
        setTimeout(() => initDetailTerminal(), 100);
      }
    }

    function closeSessionPanel() {
      panelOverlay.classList.remove('show');
      sessionPanel.classList.remove('open');
    }

    closePanelBtn.onclick = closeSessionPanel;
    panelOverlay.onclick = closeSessionPanel;

    function updatePanelInfo(msg) {
      const statusText = msg.status === 'busy' ? '运行中' : '空闲';
      const projectName = msg.projectName || '未命名项目';
      const cwd = msg.cwd || '-';
      const pid = msg.pid || '-';

      $('session-info').innerHTML = `
        <div class="status-row">
          <div class="claude-status-icon"></div>
          <span class="project-name">${projectName}</span>
        </div>
        <div class="meta-row">PID: ${pid} | ${statusText}</div>
        <div class="meta-row" style="word-break: break-all;">${cwd}</div>
      `;
    }

    function updatePanelTasks() {
      const running = taskBoard.tasks.filter(t => t.status === 'running');
      const done = taskBoard.tasks.filter(t => t.status === 'done').slice(0, 10);

      const activeContainer = $('panel-active-tasks');
      const historyContainer = $('panel-task-history');

      if (running.length === 0) {
        activeContainer.innerHTML = '<div class="task-empty">暂无任务</div>';
      } else {
        activeContainer.innerHTML = running.map(t => {
          const elapsed = Math.floor((Date.now() - t.start) / 1000);
          return `
            <div class="task-card">
              <div class="task-spinner"></div>
              <div class="task-text">${t.text}</div>
              <div class="task-meta">执行中 · ${elapsed}s</div>
            </div>
          `;
        }).join('');
      }

      if (done.length === 0) {
        historyContainer.innerHTML = '<div class="task-empty">暂无记录</div>';
      } else {
        historyContainer.innerHTML = done.map(t => {
          const elapsed = Math.floor((t.end - t.start) / 1000);
          return `
            <div class="task-card done">
              <div class="task-text">${t.text}</div>
              <div class="task-meta">已完成 · ${elapsed}s</div>
            </div>
          `;
        }).join('');
      }
    }

    function updatePanelTabs(msg) {
      const summaryContent = $('session-summary');
      const inputHistoryList = $('input-history');

      if (msg.summary) {
        const { tasks, filesModified, toolsUsed } = msg.summary;
        let html = '';

        if (tasks && tasks.length > 0) {
          html += '<div class="summary-section"><h4>任务</h4><ul>';
          tasks.forEach(task => html += `<li>${task}</li>`);
          html += '</ul></div>';
        }

        if (filesModified && filesModified.length > 0) {
          html += '<div class="summary-section"><h4>修改的文件</h4><ul>';
          filesModified.forEach(file => html += `<li>${file}</li>`);
          html += '</ul></div>';
        }

        if (toolsUsed && toolsUsed.length > 0) {
          html += '<div class="summary-section"><h4>使用的工具</h4><ul>';
          toolsUsed.forEach(tool => html += `<li>${tool}</li>`);
          html += '</ul></div>';
        }

        summaryContent.innerHTML = html || '<p style="color: var(--text-dim);">暂无摘要数据</p>';
      }

      if (msg.userInputs && msg.userInputs.length > 0) {
        inputHistoryList.innerHTML = msg.userInputs.map(input => {
          const date = new Date(input.timestamp);
          const timeStr = date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
          return `
            <div class="history-item">
              <div class="timestamp">${timeStr}</div>
              <div class="command">${input.display}</div>
            </div>
          `;
        }).join('');
      } else {
        inputHistoryList.innerHTML = '<p style="color: var(--text-dim);">暂无输入历史</p>';
      }
    }

    function initDetailTerminal() {
      const container = $('detail-terminal');
      detailTerminal = new Terminal({
        theme: {
          background: '#0A0D12',
          foreground: '#D4D4D4',
          cursor: '#38BDF8'
        },
        fontSize: 13,
        fontFamily: '"Cascadia Code", "SF Mono", Consolas, monospace',
        cursorBlink: false,
        disableStdin: true
      });

      detailTerminal.open(container);

      if (term) {
        const mainBuffer = term.buffer.active;
        for (let i = 0; i < mainBuffer.length; i++) {
          const line = mainBuffer.getLine(i);
          if (line) {
            detailTerminal.writeln(line.translateToString(true));
          }
        }
      }
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        const targetTab = btn.getAttribute('data-tab');

        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

        btn.classList.add('active');
        $(`tab-${targetTab}`).classList.add('active');

        if (targetTab === 'terminal' && detailTerminal) {
          detailTerminal.fit?.();
        }
      };
    });

    setInterval(() => {
      if (sessionPanel.classList.contains('open')) {
        updatePanelTasks();
      }
    }, 1000);
  </script>
</body>
</html>
